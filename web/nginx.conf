# Serves the built SPA AND reverse-proxies /api/* to the Fastify api, injecting
# the bearer token server-side. Result: the browser calls same-origin
# /api/external/kv/<key> (no CORS) and the token never enters the JS bundle.
#
# This file is an nginx template: ${API_TOKEN} and ${API_UPSTREAM} are filled in
# at container start by the official image's envsubst step. NGINX_ENVSUBST_FILTER
# (set in the Dockerfile) restricts substitution to those two vars so nginx's own
# $host / $uri / $scheme survive.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sync POST blobs can approach the api's 1 MB value limit; allow headroom.
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets — cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Live-update stream (SSE). Must NOT be buffered and must stay open far longer
    # than a normal request. Matched by regex so it takes precedence over the
    # /api/ prefix below; $1 rebuilds the upstream path (no /api namespace).
    location ~ ^/api/(external/kv/[^/]+/events)$ {
        proxy_pass ${API_UPSTREAM}/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${API_TOKEN}";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Same-origin API proxy. /api/external/kv/<key> -> <upstream>/external/kv/<key>
    # (the trailing slash on proxy_pass strips the /api/ prefix). The api never
    # sees the /api namespace; nginx owns it.
    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${API_TOKEN}";
        proxy_read_timeout 30s;
    }

    # ── MCP connector (see api/src/mcp/) ──────────────────────────────────────
    # Claude / ChatGPT connect to https://<host>/mcp. These locations proxy the
    # connector, its OAuth authorization server and the discovery documents
    # straight through to the api.
    #
    # The ONE thing that must not happen here is the `proxy_set_header
    # Authorization "Bearer ${API_TOKEN}"` line used by /api/ above: it would
    # overwrite the caller's own OAuth bearer and every MCP request would
    # authenticate as the sync token instead — i.e. as nobody the connector
    # knows. The api skips its API_TOKEN gate on exactly these paths and runs
    # the MCP bearer check instead.
    location = /mcp {
        proxy_pass ${API_UPSTREAM}/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tool calls can run a few seconds; SSE-framed responses must not buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding off;
    }

    # OAuth endpoints (register / authorize / token / revoke) and the human
    # landing page. Same rule: no injected Authorization header.
    location /mcp-oauth/ {
        proxy_pass ${API_UPSTREAM}/mcp-oauth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /mcp-info {
        proxy_pass ${API_UPSTREAM}/mcp-info;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Certbot's HTTP-01 challenge lives under /.well-known/ too. The host nginx
    # normally answers it before the request ever reaches this container, but if
    # it is ever proxied through, this longest-prefix match keeps it out of the
    # OAuth discovery proxy below (an ACME 404 = a failed renewal).
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # RFC 9728 / RFC 8414 discovery. MCP clients fetch these BEFORE they hold any
    # token, so they must be reachable unauthenticated at the origin root.
    location /.well-known/ {
        proxy_pass ${API_UPSTREAM}/.well-known/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hash-routed SPA — the server only ever serves index.html. no-cache does NOT
    # mean "don't cache": it means revalidate before reuse (ETag/304), so a
    # redeploy reaches every browser on its next load instead of a heuristically
    # cached shell keeping users on the old bundle for days.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
